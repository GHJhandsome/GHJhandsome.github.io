<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高宏钧 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .content {
            padding: 50px 40px;
        }

        .info-section {
            display: grid;
            gap: 30px;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .info-details {
            flex: 1;
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .info-value {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }

        .email-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .email-link {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .header p {
                font-size: 1em;
            }

            .content {
                padding: 30px 20px;
            }

            .info-item {
                flex-direction: column;
                text-align: center;
            }

            .info-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>高宏钧</h1>
            <p>浙江大学</p>
        </div>

        <div class="content">
            <div class="info-section">
                <div class="info-item">
                    <div class="info-icon">👤</div>
                    <div class="info-details">
                        <div class="info-label">姓名</div>
                        <div class="info-value">高宏钧</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">🎓</div>
                    <div class="info-details">
                        <div class="info-label">学校</div>
                        <div class="info-value">浙江大学</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">📧</div>
                    <div class="info-details">
                        <div class="info-label">邮箱</div>
                        <div class="email-list">
                            <a href="mailto:3230105077@zju.edu.cn" class="email-link">3230105077@zju.edu.cn</a>
                            <a href="mailto:2359136492@qq.com" class="email-link">2359136492@qq.com</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2024 高宏钧 | Zhejiang University
        </div>
    </div>
</body>
</html>
